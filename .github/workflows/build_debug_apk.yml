name: Build Debug APK

on:
  push:
    branches: [ syai-companion, 'claude/syai-tag-companion-app-*' ]
  workflow_dispatch:

env:
  # SHA-256 of the certificate in the DEBUG_KEYSTORE_BASE64 keystore; the build fails if the APK is signed with anything else
  EXPECTED_CERT_SHA256: 002bf58fe6471322a4be55def3b726c69dfbd52ae553f938849b147b3f888aee

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v4
    # Each runner generates a fresh debug keystore, so builds would be signed
    # differently and could not be installed over each other. Store a fixed
    # debug.keystore (store/key password "android", alias "androiddebugkey")
    # base64-encoded in the DEBUG_KEYSTORE_BASE64 secret to keep the signature stable.
    # It is passed to Gradle explicitly rather than relying on the default keystore location.
    - name: Install debug keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          keystore="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey | grep -E "Alias name|SHA256:"
          echo "SIGNING_ARGS=-Pandroid.injected.signing.store.file=$keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
        else
          echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and later builds will not install over it"
        fi
    - name: Assemble prod debug APK
      run: ./gradlew assembleProdDebug $SIGNING_ARGS
    - name: Check APK signing certificate
      run: |
        apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
        "$apksigner" verify --print-certs app/build/outputs/apk/prod/debug/*.apk | tee "$RUNNER_TEMP/certs.txt"
        if [ -n "$SIGNING_ARGS" ] && ! grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
          echo "::error::The APK is not signed with the expected key ($EXPECTED_CERT_SHA256)"
          exit 1
        fi
    - name: Run companion collector and Inter-app receiver unit tests
      run: ./gradlew :app:testProdDebugUnitTest --tests com.eveningoutpost.dexdrip.services.UiBasedCollectorTest --tests "com.eveningoutpost.dexdrip.NSEmulatorReceiver*"
    - uses: actions/upload-artifact@v4
      with:
        name: xdrip-prod-debug-${{ github.sha }}
        path: app/build/outputs/apk/prod/debug/*.apk
        if-no-files-found: error
