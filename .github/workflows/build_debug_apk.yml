name: Build Debug APK

on:
  push:
    branches: [ syai-companion, 'claude/syai-tag-companion-app-*' ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v4
    # Each runner generates a fresh debug keystore, so builds would be signed
    # differently and could not be installed over each other. Store a fixed
    # debug.keystore (store/key password "android", alias "androiddebugkey")
    # base64-encoded in the DEBUG_KEYSTORE_BASE64 secret to keep the signature stable.
    - name: Install debug keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
        else
          echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and later builds will not install over it"
        fi
    - name: Assemble prod debug APK
      run: ./gradlew assembleProdDebug
    - uses: actions/upload-artifact@v4
      with:
        name: xdrip-prod-debug-${{ github.sha }}
        path: app/build/outputs/apk/prod/debug/*.apk
        if-no-files-found: error
